<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }} | Xiaobo Yu</title>
  <meta name="description" content="{{ page.description | escape }}">
  <link rel="canonical" href="https://xiaobo-yu.com{{ page.url }}">
  <link rel="icon" href="{{ '/img/cu-logo.svg' | relative_url }}" type="image/svg+xml">
  <style>
    :root { color-scheme: light; --ink: #292b2e; --muted: #63666a; --gold: #cfb87c; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #faf9f6; color: var(--ink); font: 19px/1.75 Georgia, 'Times New Roman', serif; }
    header, main, footer { width: min(100% - 40px, 800px); margin: auto; }
    header { padding: 28px 0; border-bottom: 1px solid #ddd8cc; font: 15px/1.5 system-ui, sans-serif; display: flex; justify-content: space-between; gap: 20px; }
    a { color: #68521f; text-underline-offset: 3px; }
    a:hover { color: #111; }
    a:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }
    main { padding: 42px 0 30px; }
    .eyebrow, .meta { font: 14px/1.6 system-ui, sans-serif; color: var(--muted); }
    .eyebrow { text-transform: uppercase; letter-spacing: .12em; }
    h1 { font-size: clamp(32px, 5.5vw, 48px); line-height: 1.15; margin: 14px 0 22px; font-weight: 500; }
    h2 { font-size: 27px; line-height: 1.35; margin: 44px 0 16px; }
    p { margin: 0 0 20px; }
    .lead { font-size: 22px; }
    .note, blockquote { padding: 20px 24px; background: #f0ece2; border-left: 4px solid var(--gold); margin: 26px 0; }
    .note p:last-child, blockquote p:last-child { margin-bottom: 0; }
    .equation { overflow-x: auto; padding: 6px 0; }
    li { margin-bottom: 12px; }
    .table-wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; font-size: 17px; }
    th, td { text-align: left; vertical-align: top; padding: 12px; border-bottom: 1px solid #d8d4ca; }
    th { font-family: system-ui, sans-serif; font-size: 14px; }
    footer { padding: 25px 0 40px; border-top: 1px solid #ddd8cc; font: 14px/1.6 system-ui, sans-serif; }
    mjx-container[display="true"] { max-width: 100%; overflow-x: auto; overflow-y: hidden; }
    article > table { display: block; overflow-x: auto; }
    @media (max-width: 480px) { body { font-size: 17px; } .note, blockquote { padding: 16px; } header { flex-wrap: wrap; } }
    @media print { body { background: white; font-size: 12pt; } header, footer { display: none; } main { width: 100%; } .note, blockquote { break-inside: avoid; } }
  </style>
  <script>
    window.MathJax = { tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] }, options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] } };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js"></script>
</head>
<body>
  <header><a href="{{ '/index.html' | relative_url }}">Xiaobo Yu</a><a href="{{ '/index.html#fun-stuff' | relative_url }}">← Fun Stuff</a></header>
  <main>
    <article>
      <div class="eyebrow">Fun Stuff / {{ page.group | escape }}</div>
      <h1>{{ page.title | escape }}</h1>
      {% if page.lead %}<p class="lead">{{ page.lead | escape }}</p>{% endif %}
      {% if page.subtitle %}<p class="meta">{{ page.subtitle | escape }}</p>{% endif %}
      {{ content }}
    </article>
  </main>
  <footer><a href="{{ '/index.html#fun-stuff' | relative_url }}">← Back to Fun Stuff</a></footer>
</body>
</html>
